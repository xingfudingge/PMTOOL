# 打包流水线：构建 Tauri 安装包。
#   - push tag v*  → 构建并发布到 GitHub Release（NSIS setup.exe 作为 release 附件）
#   - workflow_dispatch → 只构建并上传 Actions Artifacts，不动 Release
name: PMTool Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        # 只要 NSIS 的 *-setup.exe；msi 由 WiX 另出，故意不上传（用户要求只给一个安装包）
        with:
          name: pmtool-windows
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" --title "PMTool $TAG" --generate-notes && break || sleep 5
          done
          gh release upload "$TAG" app/src-tauri/target/release/bundle/nsis/*-setup.exe --clobber