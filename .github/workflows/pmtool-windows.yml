# 打包流水线：构建 Tauri 安装包并上传到 GitHub Actions Artifacts。
# 产物只在 Actions → Artifacts 中下载，不会创建 GitHub Release。
# 发布是人工步骤，不在 CI 中执行。
name: PMTool Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        # 只要 NSIS 的 *-setup.exe；msi 由 WiX 另出，故意不上传（用户要求只给一个安装包）
        with:
          name: pmtool-windows
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30
          if-no-files-found: error