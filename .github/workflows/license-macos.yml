name: License Generator macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/license-generator

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/license-generator/package-lock.json

      - name: Install frontend deps
        working-directory: app/license-generator
        run: npm ci

      - name: Build bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app/license-generator

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: license-macos
          path: app/license-generator/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/license-generator/target/release/bundle/dmg/*.dmg