<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PMTOOL · 结构性改造原型 v1</title>
<style>
  :root{
    --bg:#ffffff; --sub:#fafaf8; --muted:#f4f4f1;
    --bd:#e6e6e2; --bd2:#dcdcd6;
    --tx:#1d1d1b; --tx2:#61615c; --tx3:#9a9a93;
    --ac:#5b5ce2; --ac-soft:#eeeefb; --ac-line:#d9d9f7;
    --red:#cf4436; --red-soft:#fbeeec;
    --amber:#b0741a; --amber-soft:#fbf3e4;
    --green:#2f8460; --green-soft:#ecf6f0;
    --r:10px; --r-sm:7px;
    --shadow:0 1px 2px rgba(20,20,18,.04), 0 8px 24px -16px rgba(20,20,18,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:216px 1fr;height:100vh;overflow:hidden}
  .rail{border-right:1px solid var(--bd);background:var(--sub);display:flex;flex-direction:column;padding:14px 10px}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
  .mark{width:26px;height:26px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em}
  .brand b{font-size:13px;letter-spacing:.04em}
  .brand small{display:block;font-size:10.5px;color:var(--tx3);letter-spacing:.02em;margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{
    display:flex;align-items:center;gap:9px;height:33px;padding:0 9px;border-radius:var(--r-sm);
    color:var(--tx2);font-size:12.5px;text-align:left;position:relative
  }
  .nav button:hover{background:rgba(0,0,0,.035);color:var(--tx)}
  .nav button.on{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd);font-weight:550}
  .nav button.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--ac)}
  .nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
  .nav .tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:20px;background:var(--red);color:#fff;font-weight:600}
  .rail-foot{margin-top:auto;padding:10px 9px 2px;border-top:1px solid var(--bd);color:var(--tx3);font-size:10.5px;line-height:1.6}
  .rail-foot b{color:var(--tx2);font-weight:550}

  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{height:62px;flex:0 0 auto;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--bg)}
  .tb-title h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .tb-title .sub{font-size:11.5px;color:var(--tx3);margin-top:1px}
  .tb-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .search-trigger{
    display:flex;align-items:center;gap:8px;height:31px;padding:0 10px 0 9px;min-width:238px;
    border:1px solid var(--bd);border-radius:8px;background:var(--sub);color:var(--tx3);font-size:12px
  }
  .search-trigger:hover{border-color:var(--bd2);color:var(--tx2);background:#fff}
  .search-trigger svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
  .kbd{font-size:10.5px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--tx3);background:#fff;line-height:15px}
  .today-chip{font-size:11.5px;color:var(--tx2);padding:4px 9px;border:1px solid var(--bd);border-radius:20px;background:var(--sub)}
  .avatar{width:27px;height:27px;border-radius:50%;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center;font-size:11.5px;font-weight:650;border:1px solid var(--ac-line)}

  .view{flex:1 1 auto;overflow:auto;padding:22px 24px 60px}
  .view::-webkit-scrollbar{width:10px}
  .view::-webkit-scrollbar-thumb{background:#e2e2dd;border-radius:10px;border:3px solid #fff}

  /* ---------- generic ---------- */
  .sec{display:flex;align-items:baseline;gap:10px;margin:24px 0 11px}
  .sec:first-child{margin-top:0}
  .sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
  .sec .hint{font-size:11.5px;color:var(--tx3)}
  .sec .right{margin-left:auto;font-size:11.5px;color:var(--tx3);display:flex;gap:12px;align-items:center}
  .link{color:var(--ac);font-size:11.5px}
  .link:hover{text-decoration:underline}
  .card{background:#fff;border:1px solid var(--bd);border-radius:var(--r)}
  .card-pad{padding:14px 16px}
  .btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--bd);background:#fff;font-size:12px;color:var(--tx2)}
  .btn:hover{border-color:var(--bd2);color:var(--tx);background:var(--sub)}
  .btn-pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:550}
  .btn-pri:hover{background:#4d4ed4;border-color:#4d4ed4;color:#fff}
  .btn-sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)}
  .pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:550;letter-spacing:.01em}
  .pill.red{background:var(--red-soft);color:var(--red)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.green{background:var(--green-soft);color:var(--green)}
  .pill.ac{background:var(--ac-soft);color:var(--ac)}
  .pill.gray{background:var(--muted);color:var(--tx2)}
  .new{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--ac);background:var(--ac-soft);border:1px solid var(--ac-line);border-radius:4px;padding:0 4px;line-height:14px;margin-left:6px;vertical-align:1px}

  /* ---------- kpi row ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .kpi{border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;background:#fff}
  .kpi .lab{font-size:11px;color:var(--tx3);letter-spacing:.03em}
  .kpi .val{font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
  .kpi .val small{font-size:11.5px;font-weight:450;color:var(--tx3);letter-spacing:0;margin-left:4px}
  .kpi.action{display:flex;flex-direction:column;justify-content:center;gap:7px;background:var(--sub)}
  .kpi.action .t{font-size:11.5px;color:var(--tx2)}

  /* ---------- project health ---------- */
  .pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pcard{border:1px solid var(--bd);border-radius:var(--r);padding:13px 14px 12px;background:#fff;text-align:left;transition:border-color .15s, transform .15s, box-shadow .15s}
  .pcard:hover{border-color:var(--bd2);transform:translateY(-1px);box-shadow:var(--shadow)}
  .pc-top{display:flex;align-items:center;gap:7px}
  .pc-name{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc-st{margin-left:auto;font-size:10.5px;color:var(--tx3);flex:0 0 auto}
  .pc-cust{font-size:11px;color:var(--tx3);margin:3px 0 10px}
  .pc-met{display:flex;gap:14px;font-size:11.5px;color:var(--tx2);margin-bottom:9px}
  .pc-met b{font-weight:600;color:var(--tx);margin-right:2px}
  .pc-met .r b{color:var(--red)}
  .pc-bar{height:3px;border-radius:3px;background:var(--muted);overflow:hidden}
  .pc-bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
  .pcard[data-h="red"] .pc-bar i{background:var(--red)}
  .pcard[data-h="amber"] .pc-bar i{background:var(--amber)}
  .pcard[data-h="green"] .pc-bar i{background:var(--green)}
  .pc-foot{display:flex;align-items:center;margin-top:8px;font-size:10.5px;color:var(--tx3)}
  .pc-foot .go{margin-left:auto;color:var(--ac);opacity:0;transition:opacity .15s}
  .pcard:hover .pc-foot .go{opacity:1}
  .pc-why{margin-top:8px;font-size:10.5px;color:var(--red);background:var(--red-soft);border-radius:5px;padding:3px 7px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard[data-h="red"] .pc-why{display:block}
  .pcard[data-h="amber"] .pc-why{display:block;color:var(--amber);background:var(--amber-soft)}

  /* ---------- two column ---------- */
  .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:start}
  .todo-row{display:flex;align-items:flex-start;gap:9px;padding:8px 4px;border-bottom:1px solid #f2f2ee}
  .todo-row:last-child{border-bottom:none}
  .chk{width:15px;height:15px;border:1.4px solid var(--bd2);border-radius:50%;flex:0 0 auto;margin-top:2px;display:grid;place-items:center;transition:.12s}
  .chk:hover{border-color:var(--ac);background:var(--ac-soft)}
  .todo-row.done .chk{background:var(--ac);border-color:var(--ac)}
  .todo-row.done .chk::after{content:"";width:7px;height:4px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translateY(-1px)}
  .todo-row.done .tt{color:var(--tx3);text-decoration:line-through}
  .todo-row.done .tt em{text-decoration:none;opacity:.55}
  .tt{font-size:12.5px;line-height:1.45}
  .tt em{font-style:normal;color:var(--ac);background:var(--ac-soft);border-radius:4px;padding:0 4px;font-size:11px}
  .todo-meta{font-size:10.5px;color:var(--tx3);margin-top:2px;display:flex;gap:8px}
  .add-line{display:flex;align-items:center;gap:8px;padding:9px 4px 0;border-top:1px dashed var(--bd);margin-top:6px;color:var(--tx3);font-size:11.5px}
  .log-line{display:flex;gap:8px;padding:6px 2px;font-size:12px;color:var(--tx2);border-bottom:1px solid #f5f5f1}
  .log-line:last-child{border-bottom:none}
  .log-line span:first-child{color:var(--tx3);font-variant-numeric:tabular-nums;flex:0 0 16px}
  .next-line{display:flex;gap:8px;align-items:baseline;padding:6px 2px;font-size:12px}
  .next-line .k{font-size:10.5px;color:var(--tx3);flex:0 0 42px}

  /* ---------- messages ---------- */
  .digest{border:1px solid var(--ac-line);background:linear-gradient(180deg,#fbfbfe,#fff);border-radius:var(--r);overflow:hidden}
  .digest-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid #efeffa}
  .digest-h .t{font-size:12.5px;font-weight:600}
  .digest-h .time{font-size:11px;color:var(--tx3)}
  .dstat{display:flex;border-top:1px solid #f2f2f6}
  .dstat > div{flex:1;padding:10px 16px;border-right:1px solid #f2f2f6}
  .dstat > div:last-child{border-right:none}
  .dstat .n{font-size:17px;font-weight:600;letter-spacing:-.02em}
  .dstat .l{font-size:10.5px;color:var(--tx3);margin-top:1px}
  .msg{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f3f3ef;font-size:12px}
  .msg:last-child{border-bottom:none}
  .msg .who{color:var(--tx3);font-size:10.5px;flex:0 0 58px}
  .msg .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .go{color:var(--ac);font-size:11px;opacity:0}
  .msg:hover .go{opacity:1}

  /* ---------- report ---------- */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel{height:30px;border:1px solid var(--bd);border-radius:7px;background:#fff;padding:0 8px;font-size:12px;color:var(--tx2)}
  .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin:14px 0}
  .metrics > div{background:var(--sub);padding:11px 13px}
  .metrics .l{font-size:10.5px;color:var(--tx3);letter-spacing:.02em}
  .metrics .n{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .metrics .n.warn{color:var(--red)}
  .report-body{padding:18px 22px;border:1px solid var(--bd);border-radius:var(--r);background:#fff;max-width:760px}
  .report-body h3{font-size:12.5px;margin:0 0 6px;color:var(--tx2);font-weight:600}
  .report-body ol{margin:0 0 16px;padding-left:18px;font-size:12.5px;color:var(--tx);line-height:1.9}
  .report-body ol:last-child{margin-bottom:0}
  .ai-mark{font-size:9.5px;color:var(--tx3);border:1px dashed var(--bd2);border-radius:4px;padding:0 5px;margin-left:6px}

  /* ---------- settings ---------- */
  .srow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #f3f3ef}
  .srow:last-child{border-bottom:none}
  .srow .txt{flex:1;min-width:0}
  .srow .t{font-size:12.5px}
  .srow .d{font-size:11px;color:var(--tx3);margin-top:2px}
  .sw{width:34px;height:19px;border-radius:20px;background:var(--bd2);position:relative;transition:.16s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.16s}
  .sw.on{background:var(--ac)}
  .sw.on::after{left:17px}
  .sw.dis{opacity:.45;cursor:not-allowed}
  .time-in{display:flex;gap:6px;align-items:center}
  .time-in .sw{margin-left:8px}
  .time-in input{width:74px;height:28px;border:1px solid var(--bd);border-radius:6px;padding:0 7px;font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;background:#fff}
  .time-in input:disabled{background:var(--muted);color:var(--tx3)}
  .note{background:var(--sub);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:11px;color:var(--tx2);margin-top:12px}

  /* ---------- project detail ---------- */
  .pd-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .pd-head h2{margin:0;font-size:17px;letter-spacing:-.02em}
  .pd-head .meta{font-size:11.5px;color:var(--tx3);margin-top:3px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:0 0 14px}
  .tabs button{padding:8px 11px;font-size:12px;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:550}
  table.rt{width:100%;border-collapse:collapse;font-size:11.5px}
  table.rt th{text-align:left;font-weight:550;color:var(--tx3);font-size:10.5px;letter-spacing:.02em;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--sub);white-space:nowrap}
  table.rt td{padding:9px 10px;border-bottom:1px solid #f4f4f0;vertical-align:top}
  table.rt tr:hover td{background:#fcfcfa}
  .lv{font-size:10.5px;font-weight:600;letter-spacing:.02em}

  /* ---------- palette ---------- */
  .palette{position:fixed;inset:0;background:rgba(18,18,16,.28);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:80}
  .palette[hidden]{display:none}
  .pal-box{width:640px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--bd2);border-radius:12px;box-shadow:0 24px 70px -20px rgba(20,20,18,.45);overflow:hidden}
  .pal-in{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--bd)}
  .pal-in svg{width:16px;height:16px;stroke:var(--tx3);fill:none;stroke-width:1.8}
  .pal-in input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--tx)}
  .pal-in input::placeholder{color:var(--tx3)}
  .pal-res{max-height:52vh;overflow:auto;padding:6px}
  .pal-group{font-size:10px;letter-spacing:.06em;color:var(--tx3);padding:8px 10px 4px;text-transform:uppercase}
  .pal-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
  .pal-item .s{color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-item:hover,.pal-item.sel{background:var(--ac-soft)}
  .pal-item .type{margin-left:auto;font-size:10px;color:var(--tx3);flex:0 0 auto}
  .pal-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--tx3);background:var(--sub)}
  .pal-foot span b{font-weight:600;color:var(--tx2)}
  .empty{padding:26px;text-align:center;color:var(--tx3);font-size:12px}

  /* ---------- spec panel ---------- */
  .spec-btn{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:20px;background:var(--tx);color:#fff;font-size:11.5px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
  .spec-btn:hover{background:#000}
  .spec-btn .d{width:6px;height:6px;border-radius:50%;background:#7ee2a8}
  .spec{position:fixed;right:20px;bottom:64px;width:360px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--bd2);border-radius:12px;box-shadow:0 24px 60px -20px rgba(20,20,18,.4);z-index:61;padding:14px 15px}
  .spec[hidden]{display:none}
  .spec h4{margin:0 0 4px;font-size:12.5px}
  .spec p{margin:0 0 10px;font-size:11px;color:var(--tx3);line-height:1.6}
  .spec ol{margin:0;padding:0;list-style:none}
  .spec li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #f3f3ef;font-size:11.5px}
  .spec li .i{width:17px;height:17px;border-radius:5px;background:var(--ac-soft);color:var(--ac);font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
  .spec li .b{flex:1;min-width:0}
  .spec li .b small{display:block;color:var(--tx3);font-size:10.5px;margin-top:1px}
  .spec li button{color:var(--ac);font-size:10.5px;flex:0 0 auto}
  .spec-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--tx3)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--tx);color:#fff;font-size:11.5px;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:90;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .flash{animation:flash .7s ease}
  @keyframes flash{0%{background:var(--ac-soft)}100%{background:var(--sub)}}
  @media (max-width:1180px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}

  /* ---------- structural prototype additions ---------- */
  .cap{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:9px 10px 9px 13px;background:#fff;box-shadow:var(--shadow);margin-bottom:16px}
  .cap input{flex:1;border:none;outline:none;font:inherit;font-size:13px;background:transparent;color:var(--tx)}
  .cap input::placeholder{color:var(--tx3)}
  .cap .hint{font-size:10.5px;color:var(--tx3);white-space:nowrap}
  .cap-btn{height:26px;padding:0 9px;border:1px solid var(--bd);border-radius:6px;font-size:11px;color:var(--tx3);background:var(--sub);white-space:nowrap}
  .stats{display:flex;gap:18px;align-items:baseline;margin:0 0 13px}
  .stats .s{font-size:11.5px;color:var(--tx3)}
  .stats .s b{font-size:15px;color:var(--tx);font-weight:600;letter-spacing:-.02em;margin-right:3px;font-variant-numeric:tabular-nums}
  .tl{position:relative;padding-left:0}
  .rec{display:grid;grid-template-columns:42px 1fr;gap:9px;margin-bottom:9px}
  .rec-time{font-size:10.5px;color:var(--tx3);padding-top:13px;font-variant-numeric:tabular-nums;text-align:right}
  .rec-card{border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;background:#fff;transition:border-color .15s}
  .rec-card:hover{border-color:var(--bd2)}
  .rec-card.filed{background:#fcfcfe;border-color:#e8e8f6}
  .rec-text{font-size:12.5px;line-height:1.55}

  .filed-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--green);background:var(--green-soft);border:1px solid #d8ebdf;border-radius:5px;padding:2px 7px}

  .promise{border:1px solid var(--bd);border-radius:9px;padding:10px 11px;margin-bottom:7px;background:#fff}
  .promise:last-child{margin-bottom:0}
  .p-top{display:flex;align-items:flex-start;gap:7px}
  .p-txt{font-size:12px;line-height:1.5;flex:1;min-width:0}
  .p-meta{display:flex;gap:9px;margin-top:5px;font-size:10.5px;color:var(--tx3);align-items:center}
  .dir{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:1px 5px;border-radius:4px;flex:0 0 auto;margin-top:2px}
  .dir.them{background:var(--amber-soft);color:var(--amber)}
  .dir.us{background:var(--ac-soft);color:var(--ac)}
  .stage-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 14px}
  .stage{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;background:#fff}
  .stage.done{background:var(--green-soft);border-color:#d8ebdf}
  .stage.active{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac-line)}
  .stage .sn{font-size:11px;font-weight:550;display:flex;align-items:center;gap:5px}
  .stage .sc{font-size:10px;color:var(--tx3);margin-top:4px}
  .chk-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f4f4f0;font-size:12px}
  .chk-row:last-child{border-bottom:none}
  .chk-row .box{width:14px;height:14px;border:1.4px solid var(--bd2);border-radius:4px;flex:0 0 auto;display:grid;place-items:center}
  .chk-row.on .box{background:var(--green);border-color:var(--green)}
  .chk-row.on .box::after{content:"";width:6px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translateY(-1px)}
  .chk-row.on .ct{color:var(--tx3);text-decoration:line-through}
  .rp-block{border:1px solid var(--bd);border-radius:9px;padding:12px 14px;margin-bottom:9px;background:#fff}
  .rp-block h3{font-size:11.5px;color:var(--tx2);margin:0 0 7px;letter-spacing:.05em;display:flex;align-items:center;gap:8px;font-weight:600}
  .rp-block li{font-size:12.5px;line-height:1.9}
  .src-chip{font-size:9.5px;color:var(--tx3);border:1px dashed var(--bd2);border-radius:5px;padding:1px 6px;margin-left:auto;font-weight:400;letter-spacing:0}
  .cmp{width:100%;border-collapse:collapse;font-size:11.5px}
  .cmp th{text-align:left;font-size:10px;color:var(--tx3);font-weight:550;padding:6px 8px;border-bottom:1px solid var(--bd)}
  .cmp td{padding:7px 8px;border-bottom:1px solid #f4f4f0}
  .cmp td.o{color:var(--red)}
  .cmp td.n{color:var(--green)}
</style>

<script>

   ========================================================== */
const TODAY = '2026-10-27';

const playbook = {

const records0 = [

];

const commits0 = [

  {dir:'them', txt:'历史数据口径 + 样例数据', who:'客户财务 李经理', due:'2026-10-30', state:'WAIT', quote:'10-30 前给口径和一份样例'},
  {dir:'us', txt:'接口联调记录（含遗留问题）', who:'我', due:'2026-10-28', state:'WIP', quote:'联调报告周四给'},
  {dir:'us', txt:'UAT 用例集（≥120 条）', who:'我', due:'2026-11-02', state:'TODO', quote:'11-02 交付用例集'},
  {dir:'us', txt:'培训方案（分两批）', who:'我', due:'2026-10-31', state:'TODO', quote:'31 号前给培训安排'}
];

const items0 = [

];

const state = { page:'today', records: JSON.parse(JSON.stringify(records0)), commits: JSON.parse(JSON.stringify(commits0)), items: JSON.parse(JSON.stringify(items0)) };

const KEY='pmtool-v3-proto';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({records:state.records, commits:state.commits, items:state.items})) }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d) Object.assign(state,d); }catch(e){} }
load();

const NAV = [
  {id:'today', label:'今日', icon:'<circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v4.6l3 1.8"></path>'},

];

const TITLES = {
  today:['今日','记录 → 定性 → 承诺 → 报告','先记下来，30 秒后再想它属于哪'],

  knowledge:['知识','由项目沉淀，而不是另写一遍','偏离与解法回项目收尾时回写 playbook'],

};

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>{
    const on = state.page===n.id ? 'on':'';
    return `<button class="${on}" onclick="go('${n.id}')"><svg viewBox="0 0 24 24">${n.icon}</svg>${n.label}</button>`;
  }).join('');
}
function renderTop(){
  const t = TITLES[state.page]||TITLES.today;
  document.getElementById('pgTitle').textContent = t[0];
  document.getElementById('pgSub').textContent = t[1];
}

/* ---------- 今日 ---------- */
function viewToday(){
  const raw = state.records.filter(r=>r.state==='raw').length;
  const filed = state.records.length - raw;
  const recs = state.records.map(r=>{
    const meta = `<div class="rec-meta">
        <span class="mini"><b>${r.proj}</b></span>
        <span class="mini">节点 ${r.node}</span>
        <span class="mini">${r.src}</span>
      </div>`;
    if(r.state==='raw'){
      return `<div class="rec"><div class="rec-time">${r.time}</div>
        <div class="rec-card">
          <div class="rec-text">「${r.text}」</div>
          ${meta}
          <div class="rec-act"><span class="lab">定性为</span>
            <button class="chip-btn" onclick="file('${r.id}','item')">待办 / 事项</button>
            <button class="chip-btn" onclick="file('${r.id}','risk')">风险</button>
            <button class="chip-btn" onclick="file('${r.id}','commit')">承诺</button>
            <button class="chip-btn" onclick="file('${r.id}','note')">纪要</button>
            <span style="margin-left:auto;font-size:10.5px;color:var(--tx3)">不确定就留着，晚点再说</span>
          </div>
        </div></div>`;
    }
    const map = {item:'事项',risk:'风险',commit:'承诺',note:'会议纪要'};
    const lab = map[r.state]||'已定性';
    return `<div class="rec"><div class="rec-time">${r.time}</div>
      <div class="rec-card filed">
        <div class="rec-text">「${r.text}」</div>
        ${meta}
        <div class="rec-act"><span class="filed-tag">已定性 · ${lab} <a href="javascript:void(0)" onclick="toast('原型演示：打开${lab} ${r.ref||''}')">${r.ref||''}</a></span>
          <span style="margin-left:auto;font-size:10.5px;color:var(--tx3)">已进入对应视图，不再重复录入</span>
        </div>
      </div></div>`;
  }).join('');

  const them = state.commits.filter(c=>c.dir==='them');
  const us = state.commits.filter(c=>c.dir==='us');
  const promise = c=>`<div class="promise">
      <div class="p-top"><span class="dir ${c.dir}">${c.dir==='them'?'客户答应':'我答应'}</span><div class="p-txt">${c.txt}</div></div>
      <div class="p-meta"><span>${c.who}</span><span>到期 ${c.due}</span><span class="pill ${c.state==='WAIT'?'amber':c.state==='WIP'?'ac':'gray'}" style="height:17px">${c.state==='WAIT'?'待兑现':c.state==='WIP'?'进行中':'未开始'}</span>
        <a class="link" href="javascript:void(0)" style="margin-left:auto" onclick="toast('原话：${c.quote}')">看原话</a></div>
    </div>`;

  const itemRow = i=>`<div class="chk-row ${i.on?'on':''}" onclick="toggleItem('${i.t}')">
      <span class="box"></span><span class="ct" style="flex:1">${i.t}</span>
      <span class="pill ${i.type==='风险'?'red':i.type==='问题'?'amber':'gray'}" style="height:17px">${i.type}</span>
      <span style="font-size:10.5px;color:var(--tx3);width:44px;text-align:right">${i.due}</span>
    </div>`;

  return `
  <div class="stats">
    <span class="s"><b>${state.records.length}</b>条记录</span>
    <span class="s"><b style="color:${raw?'var(--amber)':'var(--tx)'}">${raw}</b>待定性</span>
    <span class="s"><b>${filed}</b>已进对应视图</span>
    <span class="s"><b>${state.commits.length}</b>条承诺在跟</span>
    <span class="s" style="margin-left:auto">录入面：<b>1</b> 个（记录流）· 现状 9 个</span>
  </div>

  <div class="cap">
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--tx3);fill:none;stroke-width:1.7"><path d="M12 5v14M5 12h14"></path></svg>
    <input id="capInput" placeholder="记一条：客户刚说什么、现场看到什么、答应谁什么…（回车保存，⌘N 随时唤起）" onkeydown="if(event.key==='Enter'){addRecord(this.value);this.value=''}" />

    <button class="cap-btn" onclick="toast('原型演示：语音/截图仅示意，均为本机处理')">语音</button>
  </div>

  <div class="cols">
    <div>
      <div class="sec" style="margin-top:0"><h2>今天的事实</h2><span class="hint">按时间倒序 · 先记后定性</span></div>
      <div class="tl">${recs}</div>
    </div>
    <div>
      <div class="sec" style="margin-top:0"><h2>承诺账本</h2><span class="hint">两周内到期</span></div>
      <div style="margin-bottom:6px;font-size:10.5px;color:var(--tx3);letter-spacing:.04em">客户答应我 · ${them.length}</div>

      <div style="margin:12px 0 6px;font-size:10.5px;color:var(--tx3);letter-spacing:.04em">我答应客户 · ${us.length}</div>
      ${us.map(promise).join('')}
      <div class="sec"><h2>由事项派生的待办</h2><span class="hint">不再单独录</span></div>
      <div class="card card-pad" style="padding-top:4px;padding-bottom:6px">${state.items.map(itemRow).join('')}</div>

}

/* ---------- 项目（playbook 实例） ---------- */
function viewProject(){
  const stage = playbook.stages.map(s=>`
    <div class="stage ${s.done===s.total?'done':''} ${s.active?'active':''}">
      <div class="sn">${s.done===s.total?'✓ ':''}${s.name}</div>
      <div class="sc">${s.done}/${s.total} 项 · ${s.pct}%</div>
    </div>`).join('');

  const stMap = {SIGNED:['已签收','green'],DELIVERED:['已交付','ac'],WIP:['进行中','amber'],TODO:['未交付','gray']};
  const dl = deliverables.map(d=>{
    const [lab,tone]=stMap[d.st];
    return `<tr><td style="font-weight:550">${d.name}</td><td style="color:var(--tx3)">${d.stage}</td><td class="num">${d.due}</td>
      <td><span class="pill ${tone}" style="height:18px">${lab}</span></td>
      <td style="color:var(--tx3)">${d.std}</td><td style="color:var(--tx3)">${d.ev}</td></tr>`;
  }).join('');

  const chk = checklist.map(c=>`<div class="chk-row ${c.on?'on':''}" onclick="toggleCheck('${c.t}')">
      <span class="box"></span><span class="ct" style="flex:1">${c.t}</span>
      ${c.dev?`<span class="pill red" style="height:17px">偏离</span><span style="font-size:10.5px;color:var(--tx3)">${c.dev}</span>`:''}
    </div>`).join('');

  return `
  <div class="pd-head">
    <div><h2>环宇仓储 WMS 二期</h2>
      <div class="meta">PRJ-2026-014 · 环宇物流 · 合同 186 万 · 负责人 我</div></div>
    <span class="pill ac" style="margin-left:auto">playbook：${playbook.name}</span>
  </div>
  <div class="note" style="margin-top:0;margin-bottom:12px">这个项目不是从空表搭起来的：10-08 选 playbook 后一次生成 5 阶段 / 47 任务 / 6 交付物 / 40 检查项，再按客户情况裁掉 3 项。裁剪与偏离都要写原因。</div>
  <div class="stage-strip">${stage}</div>

  <div class="sec"><h2>交付物</h2><span class="hint">由 playbook 带出，不靠人记</span>

/* ---------- router ---------- */
function go(p){ state.page=p; render(); document.getElementById('view').scrollTop=0; }
function render(){
  renderNav(); renderTop();
  const v=document.getElementById('view');
  v.innerHTML = state.page==='today'?viewToday():state.page==='project'?viewProject():state.page==='reports'?viewReport():viewStub();
  save();
}

/* ---------- actions ---------- */
function addRecord(text){
  text=(text||'').trim(); if(!text){ toast('先写一句再回车'); return; }
  const now=new Date(); const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  state.records.unshift({id:'r'+Date.now(), time:hh+':'+mm, text, proj:'环宇 WMS', node:'集成联调', state:'raw', src:'手动'});
  render(); toast('已记录 · 稍后一键定性');
}
function file(id, kind){
  const r=state.records.find(x=>x.id===id); if(!r) return;
  if(kind==='commit'){
    r.state='commit'; r.ref='C-'+String(state.commits.length+9).padStart(2,'0');
    state.commits.unshift({dir:'them', txt:r.text.slice(0,26)+'…', who:'客户', due:'待补', state:'WAIT', quote:r.text});
    toast('已转成承诺 · 补上「谁、到期」即可进账本');
  } else if(kind==='risk'){
    r.state='risk'; r.ref='#'+Math.floor(Math.random()*200+150);
    state.items.unshift({t:r.text.slice(0,24)+'…', type:'风险', due:'待定', on:false});
    toast('已转成风险事项');
  } else if(kind==='note'){
    r.state='note'; r.ref='10-27 会议';
    toast('已存入纪要 · 原文保留');
  } else {
    r.state='item'; r.ref='#'+Math.floor(Math.random()*200+150);
    state.items.unshift({t:r.text.slice(0,24)+'…', type:'待办', due:'今天', on:false});
    toast('已转成待办事项');
  }
  render();
}
function toggleItem(t){ const i=state.items.find(x=>x.t===t); if(!i)return; i.on=!i.on; render(); }
function toggleCheck(t){ const c=checklist.find(x=>x.t===t); if(!c)return; c.on=!c.on; render(); }
function focusCap(){ if(state.page!=='today'){ go('today'); } setTimeout(()=>{ const el=document.getElementById('capInput'); if(el) el.focus(); },60); }

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='n'){ e.preventDefault(); focusCap(); }
  if(e.key==='Escape'){ document.getElementById('spec').hidden=true; }
});

  {n:2, t:'承诺成为一等对象', d:'客户答应我 / 我答应客户，带到期与原话，验收扯皮时有据', to:'today'},
  {n:3, t:'playbook 生成项目骨架', d:'阶段/交付物/检查项/验收标准来自标准打法，漏项在项目里直接可见', to:'project'},
  {n:4, t:'报告由事实组装', d:'每条陈述可回溯到记录、承诺或事项，不再靠回忆写', to:'reports'}
];
function toggleSpec(){ const s=document.getElementById('spec'); s.hidden=!s.hidden; }
function specGo(to){ document.getElementById('spec').hidden=true; go(to); }
function renderSpec(){
  document.getElementById('specList').innerHTML = SPEC.map(s=>`
    <li><span class="i">${s.n}</span><div class="b">${s.t}<small>${s.d}</small></div><button onclick="specGo('${s.to}')">看</button></li>`).join('');
}
function resetDemo(){ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); }
let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }

renderSpec(); render();
</script>
