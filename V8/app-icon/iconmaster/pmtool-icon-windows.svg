<!--
  PMTool App Icon · Windows
  Icon Master (唯一源) · Windows 版
  1024×1024 viewBox

  平台规范：
    - Windows 不采用 macOS 的透明安全区留白；由系统（Win11 开始菜单/任务栏）对应用
      图标统一施加圆角遮罩，因此背景铺满画布（rx=0），圆角交由系统统一决定，
      与同平台其他 App 的构图/圆角一致、不至于偏小。
    - 主体（文档 + 帐篷）位于画布中央安全区，四周稳定留白；对比度略强于 macOS 版，
      确保 16px 等小尺寸下轮廓清晰、不糊、不挤。

  色系（保留 PMTool 品牌）：
    - 背景：蓝色垂直渐变 #3b7ee5 → #4cb0fe
    - 文档：浅蓝半透明 #dde9ff（92%）
    - 折角：#b8d3f4（95%）
    - 前景（帐篷 + 弧线）：纯白 #ffffff
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3b7ee5"/>
      <stop offset="1" stop-color="#4cb0fe"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角矩形（含安全区域 · 约 86% 填充 · rx≈200） -->
  <rect x="0" y="0" width="1024" height="1024" rx="0" ry="0" fill="url(#bgGrad)"/>

  <!-- 中央文档主体（圆角矩形 + 半透明浅蓝） -->
  <rect x="312" y="282" width="400" height="460" rx="30" ry="30"
        fill="#dde9ff" fill-opacity="0.92"/>

  <!-- 右上折角（page fold） -->
  <path d="M 712 282 L 712 366 L 628 282 Z" fill="#b8d3f4" fill-opacity="0.95"/>
  <!-- 折痕白线 -->
  <path d="M 628 366 L 712 282" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- 帐篷图标：外月牙弧（white stroke · 围绕帐篷底部） -->
  <path d="M 350 626 A 205 215 0 0 1 674 626"
        stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round"/>

  <!-- 帐篷主体（白色填充三角形 · 尖顶朝上） -->
  <path d="M 512 416 L 608 630 L 416 630 Z" fill="#ffffff"/>
</svg>