<!--
  PMTool App Icon · 方向 D · PM Brand
  跨平台 · 1024×1024 viewBox

  设计来源：维护者 2026-08-24 提供的参考图
  风格：macOS Big Sur 文档管理图标
    - 圆角矩形背景（蓝色垂直渐变）
    - 中央半透明文档形状（圆角矩形 + 右上折角 page fold）
    - 文档中央白色帐篷图标（外月牙弧 + 内三角）
    - 整体留白约 20% 给 macOS 系统圆角遮罩

  色系（视觉匹配参考图）：
    - 背景：蓝色渐变 #3b7ee5 → #4cb0fe
    - 文档：浅蓝半透明 #dce9ff（85% 不透明）
    - 折角：#b8d3f4（90% 不透明）
    - 前景（帐篷+弧线）：纯白 #ffffff
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#3b7ee5"/>
      <stop offset="1" stop-color="#4cb0fe"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角矩形（蓝色渐变 · rx=230 macOS Big Sur 风格） -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>

  <!-- 中央文档主体（圆角矩形 + 半透明浅蓝填充） -->
  <rect x="290" y="270" width="444" height="500" rx="36" ry="36"
        fill="#dce9ff" fill-opacity="0.85"/>

  <!-- 右上折角（page fold · 较深蓝三角形 + 折痕白线） -->
  <path d="M 650 270 L 734 270 L 734 354 Z" fill="#b8d3f4" fill-opacity="0.9"/>
  <path d="M 650 270 L 650 354 L 734 354"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.55"/>

  <!-- 帐篷图标：外月牙弧（白色 stroke · 围绕帐篷底部） -->
  <path d="M 340 600 A 200 220 0 0 1 690 600"
        stroke="#ffffff" stroke-width="44" fill="none" stroke-linecap="round"/>

  <!-- 帐篷主体（白色填充三角形 · 尖顶朝上） -->
  <path d="M 512 360 L 640 610 L 384 610 Z" fill="#ffffff"/>
</svg>
