<!--
  PMTool Logo · 方向 C · 完全抽象符号
  理念：几何对称符号 · 像 Notion 文档 / Arc 浏览器 / Raycast 射线
  100×100 viewBox · 圆角 22 · Indigo 填充
  几何：从中心向四方辐射的「节点 + 连接」网络
  含义：知识 / 项目 / 任务 / 文件的连接点 · 个人工作台的核心
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#5B5CE2"/>

  <!-- 中心节点：实心方块 -->
  <rect x="44" y="44" width="12" height="12" rx="2.5" fill="#FFFFFF"/>

  <!-- 四个角节点：小圆点 -->
  <circle cx="28" cy="28" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="72" cy="28" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="28" cy="72" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="72" cy="72" r="4.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- 四条连接线 · 中心到四角 -->
  <line x1="32" y1="32" x2="44" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="68" y1="32" x2="56" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="68" x2="44" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="68" y1="68" x2="56" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
