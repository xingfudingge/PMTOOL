<!--
  PMTool Logo · 方向 A · Workspace（工作空间 / 画布）
  理念：抽象的工作空间 · 一扇窗 + 一个面 · Things / Bear 风格
  100×100 viewBox · 圆角 22 · Indigo 填充
  几何：圆角矩形底（窗框）+ 内部一斜角折面（桌面 / 画布）
  含义：你的私人桌面，一个独立的工作空间
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 圆角底框 · macOS 风格 squircle -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#5B5CE2"/>

  <!-- 内部「桌面 / 画布」折面 -->
  <!-- 一条对角斜线把矩形切成两个三角形：上方亮（桌面），下方暗（投影） -->
  <path d="M 24 30 L 76 30 L 76 70 L 24 70 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" opacity="0.95"/>
  <!-- 桌面顶端的水平线强调「桌面边缘」 -->
  <line x1="24" y1="30" x2="76" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 桌面上的小方块 · 代表任务 / 笔记 / 文件 -->
  <rect x="30" y="38" width="14" height="10" rx="2" fill="#FFFFFF" opacity="0.55"/>
  <rect x="48" y="38" width="14" height="10" rx="2" fill="#FFFFFF" opacity="0.8"/>
  <rect x="30" y="52" width="14" height="10" rx="2" fill="#FFFFFF" opacity="0.35"/>
  <rect x="48" y="52" width="14" height="10" rx="2" fill="#FFFFFF" opacity="0.55"/>
</svg>
