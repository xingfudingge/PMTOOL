<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMTool 授权码生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #5b5ce2;
            --bg-dark: #f5f5f7;
            --bg-card: #ffffff;
            --bg-input: #f9fafb;
            --bg-hover: #e5e7eb;
            --text: #1a1a1a;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            padding: 0;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .label {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 0.75rem;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-input);
            color: var(--text);
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            transition: all 0.15s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-hint {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.3;
        }

        .radio-group {
            display: flex;
            gap: 6px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input {
            display: none;
        }

        .radio-option span {
            display: block;
            text-align: center;
            padding: 8px 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            color: var(--text);
            transition: all 0.15s;
            user-select: none;
        }

        .radio-option span:hover {
            background: var(--bg-hover);
        }

        .radio-option input:checked + span {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--primary);
            color: #ffffff;
        }

        .btn:hover {
            opacity: 0.95;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .output-area {
            margin-top: 8px;
        }

        .output-label {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
            font-size: 0.75rem;
        }

        .output-box {
            position: relative;
        }

        .output-text {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 11px;
            background: var(--bg-input);
            color: var(--primary);
            line-height: 1.4;
            min-height: 100px;
            word-break: break-all;
        }

        .output-text:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        .copy-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 600;
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .copy-btn:hover {
            background: var(--border);
        }

        .copy-btn.copied {
            background: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 12px 0;
        }

        .hidden {
            display: none;
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-refresh {
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }

        .history-refresh:hover {
            background: var(--border);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-empty {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 14px 0;
        }

        .history-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: var(--bg-input);
        }

        .history-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 6px;
        }

        .history-meta {
            font-size: 11px;
            color: var(--text);
            line-height: 1.6;
            word-break: break-all;
        }

        .history-meta b {
            color: var(--primary);
        }

        .history-type {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            background: #eef2ff;
            color: var(--primary);
            white-space: nowrap;
        }

        .history-type.perm {
            background: #ecfdf5;
            color: #059669;
        }

        .history-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-toggle, .history-del {
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text);
        }

        .history-toggle:hover {
            background: var(--bg-hover);
        }

        .history-del:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .history-code {
            margin: 6px 0 0;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 10px;
            line-height: 1.5;
            color: var(--primary);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PMTool</h1>
            <p>授权码生成器</p>
        </div>

        <div class="card">
            <div class="label">设备唯一值</div>
            <input type="text" id="deviceId" class="input-field" placeholder="从 PMTool「设置」→「授权管理」复制" />
        </div>

        <div class="card">
            <div class="label">授权期限</div>
            <div class="radio-group">
                <label class="radio-option" onclick="selectDuration(30)">
                    <input type="radio" name="duration" value="30" checked onchange="updateExpireDate()">
                    <span>30 天</span>
                </label>
                <label class="radio-option" onclick="selectDuration(365)">
                    <input type="radio" name="duration" value="365" onchange="updateExpireDate()">
                    <span>1 年</span>
                </label>
                <label class="radio-option" onclick="selectDuration(0)">
                    <input type="radio" name="duration" value="0" onchange="updateExpireDate()">
                    <span>永久</span>
                </label>
            </div>
        </div>

        <div class="card">
            <div class="label">开始日期</div>
            <input type="date" id="startDate" class="input-field" />
        </div>

        <div id="expireDateContainer" class="card">
            <div class="label">到期日期</div>
            <input type="date" id="expireDate" class="input-field" />
        </div>

        <button class="btn" id="generateBtn" onclick="generateLicense()">生成授权码</button>

        <div id="outputSection" class="hidden">
            <div class="divider"></div>
            <div class="output-area">
                <div class="output-label">授权码</div>
                <div class="output-box">
                    <textarea id="licenseOutput" class="output-text" readonly></textarea>
                    <button class="copy-btn" id="copyBtn" onclick="copyLicense()">复制</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="history-head">
                <div class="label" style="margin-bottom:0;">授权记录历史</div>
                <button class="history-refresh" onclick="refreshHistory()">刷新</button>
            </div>
            <div id="historyList" class="history-list"><div class="history-empty">暂无记录</div></div>
        </div>
    </div>

    <script>
        // 设置默认日期
        const today = new Date();
        const nextMonth = new Date();
        nextMonth.setDate(today.getDate() + 30);
        const nextYear = new Date();
        nextYear.setFullYear(today.getFullYear() + 1);

        document.getElementById('startDate').valueAsDate = today;

        // 选择期限
        function selectDuration(days) {
            const radios = document.querySelectorAll('input[name="duration"]');
            radios.forEach(radio => {
                if (radio.value === String(days)) {
                    radio.checked = true;
                }
            });
            updateExpireDate();
        }

        // 更新到期日期
        function updateExpireDate() {
            const duration = parseInt(document.querySelector('input[name="duration"]:checked').value);
            const startDate = new Date(document.getElementById('startDate').value);
            const expireDate = new Date(startDate);

            if (isNaN(startDate.getTime())) {
                document.getElementById('expireDate').value = '';
                return;
            }

            if (duration === 0) {
                // 永久 - 隐藏到期日期
                document.getElementById('expireDateContainer').classList.add('hidden');
                document.getElementById('expireDate').value = '';
            } else {
                // 显示到期日期
                document.getElementById('expireDateContainer').classList.remove('hidden');
                expireDate.setDate(startDate.getDate() + duration);
                document.getElementById('expireDate').valueAsDate = expireDate;
            }
        }

        // 生成授权码
        async function generateLicense() {
            const deviceId = document.getElementById('deviceId').value.trim();
            if (!deviceId) {
                alert('请输入设备唯一值');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const license = await window.__TAURI__.core.invoke('generate_license_command', {
                    deviceId: deviceId,
                    durationDays: parseInt(document.querySelector('input[name="duration"]:checked').value),
                    startDate: document.getElementById('startDate').value + 'T00:00:00+08:00'
                });

                document.getElementById('licenseOutput').value = license;
                document.getElementById('outputSection').classList.remove('hidden');
                document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
                refreshHistory();
            } catch (error) {
                alert('生成失败：' + error);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // 复制授权码
        async function copyLicense() {
            const license = document.getElementById('licenseOutput').value;
            const btn = document.getElementById('copyBtn');

            try {
                await navigator.clipboard.writeText(license);
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 2000);
            } catch {
                document.getElementById('licenseOutput').select();
                document.execCommand('copy');
                btn.textContent = '✓';
                btn.classList.add('copied');
            }
        }

        // ================== 授权记录历史 ==================

        // 期限显示：DAYS_30 → 30 天 / DAYS_365 → 1 年 / PERPETUAL → 永久
        function typeLabel(t) {
            if (t === 'PERPETUAL') return '永久';
            const m = /^DAYS_(\d+)$/.exec(t);
            if (m) {
                const d = parseInt(m[1], 10);
                return d >= 365 ? '1 年' : d + ' 天';
            }
            return t || '—';
        }

        // rfc3339 → YYYY-MM-DD（空 → 永久）
        function fmtDate(rfc) {
            if (!rfc) return '永久';
            const d = new Date(rfc);
            if (isNaN(d.getTime())) return rfc;
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }

        function renderHistory(records) {
            const list = document.getElementById('historyList');
            if (!records || records.length === 0) {
                list.innerHTML = '<div class="history-empty">暂无记录</div>';
                return;
            }
            list.innerHTML = records.map(r => `
                <div class="history-item">
                    <div class="history-top">
                        <div class="history-meta">
                            设备：<b>${r.device_id}</b><br>
                            <span class="history-type ${r.license_type === 'PERPETUAL' ? 'perm' : ''}">${typeLabel(r.license_type)}</span>
                            &nbsp;${fmtDate(r.start_time)} ~ ${fmtDate(r.expire_time)}
                        </div>
                        <div class="history-actions">
                            <button class="history-toggle" onclick="toggleCode(this)">查看授权码</button>
                            <button class="history-del" onclick="deleteRecord('${r.id.trim()}')">删除</button>
                        </div>
                    </div>
                    <pre class="history-code hidden">${r.license}</pre>
                </div>`).join('');
        }

        // 拉取历史（新生成的在前）
        async function refreshHistory() {
            try {
                const records = await window.__TAURI__.core.invoke('list_license_history');
                renderHistory(records);
            } catch (e) {
                console.error('加载授权历史失败:', e);
                document.getElementById('historyList').innerHTML = '<div class="history-empty">加载失败，点击「刷新」重试</div>';
            }
        }

        // 展开 / 收起授权码
        function toggleCode(btn) {
            const code = btn.closest('.history-item').querySelector('.history-code');
            const isHidden = code.classList.toggle('hidden');
            btn.textContent = isHidden ? '查看授权码' : '收起';
        }

        // 删除一条记录
        async function deleteRecord(id) {
            if (!confirm('确定删除这条授权记录？删除后不可恢复。')) return;
            try {
                await window.__TAURI__.core.invoke('delete_license_history', { id });
                refreshHistory();
            } catch (e) {
                alert('删除失败：' + e);
            }
        }

        // 首次加载 + 生成成功后刷新
        refreshHistory();
    </script>
</body>
</html>
