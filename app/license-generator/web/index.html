<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMTool 授权码生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #5b5ce2;
            --primary-hover: #4d4ed4;
            --primary-active: #4242c6;
            --primary-subtle: #eeeefb;
            --bg-dark: #fafaf8;
            --bg-card: #ffffff;
            --bg-input: #fafaf8;
            --bg-hover: rgba(0, 0, 0, 0.04);
            --text: #37352f;
            --text-muted: #787774;
            --border: #e5e5e2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            padding: 0;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* 参考 PMTool 主应用：内容铺满窗口，仅留统一外边距 */
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 20px 24px 32px;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px 8px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .label {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 0.78rem;
        }

        .input-field {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-input);
            color: var(--text);
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            transition: all 0.15s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:disabled {
            background: var(--bg-hover);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .input-hint {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.3;
        }

        .radio-group {
            display: flex;
            gap: 6px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input {
            display: none;
        }

        .radio-option span {
            display: block;
            text-align: center;
            padding: 8px 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            color: var(--text);
            transition: all 0.15s;
            user-select: none;
        }

        .radio-option span:hover {
            background: var(--bg-hover);
        }

        .radio-option input:checked + span {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--primary);
            color: #ffffff;
        }

        .btn:hover {
            opacity: 0.95;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .output-area {
            margin-top: 0;
        }

        .output-label {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
            font-size: 0.75rem;
        }

        .output-box {
            position: relative;
        }

        .output-text {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 11px;
            background: var(--bg-input);
            color: var(--primary);
            line-height: 1.4;
            min-height: 96px;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 600;
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .copy-btn:hover {
            background: var(--border);
        }

        .copy-btn.copied {
            background: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 12px 0;
        }

        .hidden {
            display: none;
        }

        /* 内联提示条（WKWebView 不支持 window.alert/confirm） */
        .msg {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .msg.success {
            background: #d1fae5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        /* 授权记录历史 */
        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .history-refresh {
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 600;
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }

        .history-refresh:hover {
            background: var(--border);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-empty {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 16px 0;
        }

        .history-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: var(--bg-input);
        }

        .history-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 6px;
        }

        .history-meta {
            font-size: 11px;
            color: var(--text);
            line-height: 1.6;
            word-break: break-all;
        }

        .history-meta b {
            color: var(--primary);
        }

        .history-type {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            background: #eef2ff;
            color: var(--primary);
            white-space: nowrap;
        }

        .history-type.perm {
            background: #ecfdf5;
            color: #059669;
        }

        .history-type.custom {
            background: #fff7ed;
            color: #c2410c;
        }

        .history-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-action {
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text);
        }

        .history-action:hover {
            background: var(--bg-hover);
        }

        .history-del:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .history-del-armed {
            background: #dc2626 !important;
            border-color: #dc2626 !important;
            color: #ffffff !important;
        }

        .history-code {
            margin: 6px 0 0;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 10px;
            line-height: 1.5;
            color: var(--primary);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 120px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PMTool</h1>
            <p>授权码生成器</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="generate" onclick="switchTab('generate')">生成授权</button>
            <button class="tab-btn" data-tab="history" onclick="switchTab('history')">授权记录</button>
        </div>

        <div id="msg"></div>

        <!-- ============ 生成授权 ============ -->
        <div id="viewGenerate">
            <div class="card">
                <div class="label">设备唯一值</div>
                <input type="text" id="deviceId" class="input-field" placeholder="从 PMTool「设置」→「授权管理」复制" />
            </div>

            <div class="card">
                <div class="label">订单编号 <span style="color:#b91c1c">*</span></div>
                <input type="text" id="orderNo" class="input-field" placeholder="仅作记录，不影响授权" />
            </div>

            <div class="card">
                <div class="label">授权期限</div>
                <div class="radio-group">
                    <label class="radio-option" onclick="selectDuration(30)">
                        <input type="radio" name="duration" value="30" checked onchange="updateExpireDate()">
                        <span>30 天</span>
                    </label>
                    <label class="radio-option" onclick="selectDuration(365)">
                        <input type="radio" name="duration" value="365" onchange="updateExpireDate()">
                        <span>1 年</span>
                    </label>
                    <label class="radio-option" onclick="selectDuration(0)">
                        <input type="radio" name="duration" value="0" onchange="updateExpireDate()">
                        <span>永久</span>
                    </label>
                    <label class="radio-option" onclick="selectDuration(-1)">
                        <input type="radio" name="duration" value="-1" onchange="updateExpireDate()">
                        <span>自定义</span>
                    </label>
                </div>
            </div>

            <div class="card">
                <div class="label">开始日期</div>
                <input type="date" id="startDate" class="input-field" onchange="onStartDateChange()" />
            </div>

            <div id="expireDateContainer" class="card">
                <div class="label">到期日期</div>
                <input type="date" id="expireDate" class="input-field" />
                <div id="expireHint" class="input-hint"></div>
            </div>

            <button class="btn" id="generateBtn" onclick="generateLicense()">生成授权码</button>

            <div id="outputSection" class="hidden">
                <div class="divider"></div>
                <div class="output-area">
                    <div class="output-label">授权码</div>
                    <div class="output-box">
                        <textarea id="licenseOutput" class="output-text" readonly></textarea>
                        <button class="copy-btn" id="copyBtn" onclick="copyLicense()">复制</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ 授权记录 ============ -->
        <div id="viewHistory" class="hidden">
            <div class="card">
                <div class="history-head">
                    <div class="label" style="margin-bottom:0;">授权记录</div>
                    <button class="history-refresh" onclick="refreshHistory()">刷新</button>
                </div>
                <div id="historyList" class="history-list"><div class="history-empty">暂无记录</div></div>
            </div>
        </div>
    </div>

    <script>
        const today = new Date();
        document.getElementById('startDate').valueAsDate = today;

        let statusTimer = null;

        // 内联提示（WKWebView 不支持 alert/confirm）
        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.className = 'msg ' + (type || 'error');
            el.textContent = text;
            clearTimeout(statusTimer);
            if (type !== 'error') {
                statusTimer = setTimeout(() => { el.className = 'msg'; el.textContent = ''; }, 4000);
            }
        }

        // ============ 页签切换 ============
        function switchTab(name) {
            document.getElementById('viewGenerate').classList.toggle('hidden', name !== 'generate');
            document.getElementById('viewHistory').classList.toggle('hidden', name !== 'history');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === name);
            });
            if (name === 'history') refreshHistory();
        }

        // ============ 期限 / 日期联动 ============
        // 30天/1年：到期日期只读自动算；永久：隐藏到期；自定义：开始/到期都可手填、互不联动
        function selectDuration(days) {
            const radios = document.querySelectorAll('input[name="duration"]');
            radios.forEach(r => { r.checked = (String(r.value) === String(days)); });
            updateExpireDate();
        }

        function isPreset() {
            const v = parseInt(document.querySelector('input[name="duration"]:checked').value, 10);
            return v > 0; // 30 / 365
        }

        function isPerpetual() {
            return parseInt(document.querySelector('input[name="duration"]:checked').value, 10) === 0;
        }

        function onStartDateChange() {
            // 预设：改开始日期时自动重算到期；自定义 / 永久：不动
            if (isPreset()) updateExpireDate();
        }

        function updateExpireDate() {
            const duration = parseInt(document.querySelector('input[name="duration"]:checked').value, 10);
            const startInput = document.getElementById('startDate');
            const expireInput = document.getElementById('expireDate');
            const container = document.getElementById('expireDateContainer');
            const hint = document.getElementById('expireHint');

            if (duration === 0) {
                // 永久：隐藏到期
                container.classList.add('hidden');
                expireInput.value = '';
                expireInput.disabled = true;
                hint.textContent = '';
                return;
            }

            container.classList.remove('hidden');

            if (duration > 0) {
                // 预设：自动算到期，只读
                const sd = new Date(startInput.value);
                if (!isNaN(sd.getTime())) {
                    const ed = new Date(sd);
                    ed.setDate(sd.getDate() + duration);
                    expireInput.valueAsDate = ed;
                }
                expireInput.disabled = true;
                hint.textContent = '按「' + (duration >= 365 ? '1 年' : duration + ' 天') + '」自动计算，如需自定义请选「自定义」';
            } else {
                // 自定义：可手填，不联动
                expireInput.disabled = false;
                hint.textContent = '开始 / 到期日期均可自由填写';
            }
        }

        // ============ 生成授权码 ============
        async function generateLicense() {
            const deviceId = document.getElementById('deviceId').value.trim();
            if (!deviceId) { showMsg('请输入设备唯一值'); return; }
            const orderNo = document.getElementById('orderNo').value.trim();
            if (!orderNo) { showMsg('请填写订单编号'); return; }

            const duration = parseInt(document.querySelector('input[name="duration"]:checked').value, 10);
            const startInput = document.getElementById('startDate');
            const expireInput = document.getElementById('expireDate');
            const start = startInput.value;

            if (!start) { showMsg('请选择开始日期'); return; }
            if (duration < 0) {
                if (!expireInput.value) { showMsg('「自定义」请填写到期日期'); return; }
                if (expireInput.value <= start) { showMsg('到期日期需晚于开始日期'); return; }
            }

            const args = {
                deviceId: deviceId,
                durationDays: duration,
                startDate: start + 'T00:00:00+08:00',
                orderNo: orderNo
            };
            if (duration !== 0) {
                args.expireDate = expireInput.value + 'T00:00:00+08:00';
            }

            const btn = document.getElementById('generateBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const license = await window.__TAURI__.core.invoke('generate_license_command', args);
                document.getElementById('licenseOutput').value = license;
                document.getElementById('outputSection').classList.remove('hidden');
                showMsg('授权码已生成，可在「授权记录」中查看', 'success');
            } catch (error) {
                showMsg('生成失败：' + error);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        // ============ 复制授权码 ============
        function copyText(text, btn, okLabel) {
            const done = () => {
                if (!btn) return;
                const old = btn.textContent;
                btn.textContent = '✓';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1600);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) { }
            document.body.removeChild(ta);
            done && done();
        }

        function copyLicense() {
            copyText(document.getElementById('licenseOutput').value, document.getElementById('copyBtn'));
        }

        function copyFromItem(btn) {
            const code = btn.closest('.history-item').querySelector('.history-code').textContent.trim();
            copyText(code, btn);
        }

        // ============ 授权记录历史 ============
        function typeLabel(t) {
            if (t === 'PERPETUAL') return '永久';
            const m = /^DAYS_(\d+)$/.exec(t);
            if (m) {
                const d = parseInt(m[1], 10);
                return d >= 365 ? '1 年' : d + ' 天';
            }
            return '自定义';
        }

        function typeClass(t) {
            if (t === 'PERPETUAL') return 'perm';
            return /^DAYS_\d+$/.test(t) ? '' : 'custom';
        }

        function fmtDate(rfc) {
            if (!rfc) return '永久';
            const d = new Date(rfc);
            if (isNaN(d.getTime())) return rfc;
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }

        function renderHistory(records) {
            const list = document.getElementById('historyList');
            if (!records || records.length === 0) {
                list.innerHTML = '<div class="history-empty">暂无授权记录</div>';
                return;
            }
            list.innerHTML = records.map(r => `
                <div class="history-item">
                    <div class="history-top">
                        <div class="history-meta">
                            设备：<b>${r.device_id}</b><br>
                            订单：<b>${r.order_no || '—'}</b><br>
                            <span class="history-type ${typeClass(r.license_type)}">${typeLabel(r.license_type)}</span>
                            &nbsp;${fmtDate(r.start_time)} ~ ${fmtDate(r.expire_time)}
                        </div>
                        <div class="history-actions">
                            <button class="history-action" onclick="toggleCode(this)">查看</button>
                            <button class="history-action" onclick="copyFromItem(this)">复制</button>
                            <button class="history-action history-del" onclick="deleteRecord(event, '${r.id.trim()}', this)">删除</button>
                        </div>
                    </div>
                    <pre class="history-code hidden">${r.license}</pre>
                </div>`).join('');
        }

        async function refreshHistory() {
            try {
                const records = await window.__TAURI__.core.invoke('list_license_history');
                renderHistory(records);
            } catch (e) {
                console.error('加载授权历史失败:', e);
                document.getElementById('historyList').innerHTML = '<div class="history-empty">加载失败，点击「刷新」重试</div>';
            }
        }

        function toggleCode(btn) {
            const code = btn.closest('.history-item').querySelector('.history-code');
            const isHidden = code.classList.toggle('hidden');
            btn.textContent = isHidden ? '查看' : '收起';
        }

        // 内联二次确认删除，不依赖 window.confirm
        function deleteRecord(ev, id, btn) {
            if (btn.dataset.confirm === '1') {
                btn.dataset.confirm = '';
                btn.textContent = '删除';
                btn.classList.remove('history-del-armed');
                doDelete(id);
            } else {
                btn.dataset.confirm = '1';
                btn.textContent = '确认删除?';
                btn.classList.add('history-del-armed');
                setTimeout(() => {
                    if (btn.dataset.confirm === '1') {
                        btn.dataset.confirm = '';
                        btn.textContent = '删除';
                        btn.classList.remove('history-del-armed');
                    }
                }, 3000);
            }
        }

        async function doDelete(id) {
            try {
                await window.__TAURI__.core.invoke('delete_license_history', { id });
                showMsg('已删除该授权记录', 'success');
                refreshHistory();
            } catch (e) {
                showMsg('删除失败：' + e);
            }
        }

        // 首次加载
        refreshHistory();
        updateExpireDate();
    </script>
</body>
</html>
