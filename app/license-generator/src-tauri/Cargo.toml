[package]
name = "pmtool-license-generator"
version = "1.0.0"
description = "PMTool License Generator Backend"
authors = ["PMTool Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.0", features = ["devtools", "custom-protocol"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Ed25519 signing (v2.0 as specified)
ed25519-dalek = { version = "2.0", features = ["rand_core", "serde"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
base64 = "0.21"
rand = "0.8"
hex = "0.4"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
chacha20poly1305 = "0.10"
rfd = "0.14"
sha2 = "0.10"
regex = "1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# Include desktop-only features if needed

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
